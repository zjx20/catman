services:
  catman:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: catman:0.1.0
    container_name: catman
    restart: unless-stopped
    environment:
      # Claude 订阅认证:先在宿主用 `claude setup-token` 生成 1 年期 token
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      CATMAN_CHANNEL: wechat
      # 排查用:打开后每条入站 iLink 消息打一行结构摘要(只有键名与标量,不含
      # base64 与媒体密钥)。用于确认「图 + 文字」这两条消息有没有可用的聚合键。
      CATMAN_ILINK_TRACE: ${CATMAN_ILINK_TRACE:-0}
      CATMAN_DATA_DIR: /data
      CLAUDE_CONFIG_DIR: /data/claude
      # 日志时间戳的时区。容器不会自动继承宿主时区,不设就是 UTC ——
      # 拿日志和微信里的消息时间对账时会差好几个小时。在 .env 里设 TZ=Asia/Shanghai。
      TZ: ${TZ:-UTC}
      # dashboard 访问令牌(整站生效)。留空则首次启动自动生成,写入 /data/dashboard-token
      # 并打印在日志里 —— 不存在"无鉴权"这个选项:能打开 dashboard 的人可以扫码接入,
      # 而接入者拥有宿主 root 级别的能力。
      CATMAN_ADMIN_TOKEN: ${CATMAN_ADMIN_TOKEN:-}
      # 下面这些只是**基线**。管理员在 dashboard 聊天页改的值写进 /data/settings.json,
      # 优先级更高且改完立即生效、不用重启;每个用户还能再覆盖属于自己的那几项。
      # 所以这里通常不需要动 —— 只在想改"出厂默认"时才设。
      # CATMAN_MODEL: opus
      # 允许用户选的模型。用别名而非完整 id:别名不随版本腐化。
      # CATMAN_MODEL_ALLOWLIST: "opus,sonnet,haiku"
      # CATMAN_SESSION_TIMEOUT_MS: "3600000"
      # CATMAN_RETENTION_MS: "2592000000"
      # 同时进行的回合数上限(跨用户):软路由 CPU 与订阅限流的双重约束
      # CATMAN_MAX_CONCURRENT_TURNS: "2"
      # iLink App 标识已内置(appid="bot",无需申请);仅在官方包升级/真机校准时才需覆盖:
      # ILINK_APP_ID: "bot"
      # ILINK_APP_VERSION: "2.4.6"     # 会编码成 iLink-App-ClientVersion
      # ILINK_CHANNEL_VERSION: "1.0.2" # base_info.channel_version,以真机实测为准
      # 宿主 dockerd 比容器内 CLI 老太多时,CLI 报 "client version is too new";
      # 用宿主 `docker version --format '{{.Server.APIVersion}}'` 的值锁定协商版本:
      # DOCKER_API_VERSION: "1.43"
    volumes:
      - ./data:/data
      # 让助手操作宿主 Docker(docker-outside-of-docker):容器内只有 CLI,daemon 是宿主的。
      # ⚠️ 这等于把宿主 root 权限交给助手 —— 有了 socket 就能 `docker run -v /:/host`
      # 读写宿主整个文件系统。容器不再是隔离边界,仅在自己完全信任的机器上开启;
      # 不需要该能力时删掉这一行(镜像里的 docker CLI 没有 socket 就是个摆设,无害)。
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    # 容器以非 root 的 catman(uid 10001)运行(bypassPermissions 的硬性要求),
    # 需补一个能读 docker.sock 的补充组,否则容器内 docker 报 permission denied。
    # 该 GID 属于宿主而非镜像,各机器不同,所以运行时注入而不是写死进镜像 ——
    # 取值:`stat -c '%g' /var/run/docker.sock`,写进 .env 的 DOCKER_GID。
    # 默认 0(root 组)适配 socket 属 root:root 的系统(OpenWrt 常见);
    # Debian/Ubuntu 多为 root:docker,必须显式设置。
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "8787:8787" # dashboard(整站需 CATMAN_ADMIN_TOKEN;仍应只在内网暴露)
